<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JazzCraft</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --red:#ff1a1a;
      --dark-red:#6f0b0b;
      --cyan:#00e5ff;
      --text:#d6d6d6;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      height:100vh;
      overflow:hidden;
      font-family:'Orbitron',sans-serif;
      background:#000;
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    canvas{
      position:absolute;
      inset:0;
      z-index:0;
    }

    .container{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .icon{
      width:64px;
      height:64px;
      image-rendering:pixelated;
      margin-bottom:10px;
    }

    h1{
      margin:0;
      font-size:78px;
      color:var(--red);
      letter-spacing:6px;
    }

    p{
      margin-top:8px;
      font-size:14px;
      color:#aaa;
    }

    .buttons{
      margin-top:30px;
    }

    .btn{
      display:inline-block;
      margin:8px;
      padding:14px 30px;
      font-size:16px;
      color:white;
      text-decoration:none;
      border:1px solid var(--dark-red);
      background:rgba(0,0,0,0.5);
      border-radius:10px;
      transition:0.2s ease;
    }

    .btn:hover{
      background:var(--red);
      transform:scale(1.05);
    }

    /* pulse */
    .discord{
      animation:pulse 2.8s ease-in-out infinite;
    }

    @keyframes pulse{
      0%{ box-shadow:0 0 0 rgba(255,26,26,0); }
      50%{ box-shadow:0 0 10px rgba(255,26,26,0.25); }
      100%{ box-shadow:0 0 0 rgba(255,26,26,0); }
    }

    .ip{
      margin-top:18px;
      font-size:12px;
      color:#aaa;
      padding:6px 10px;
      border:1px solid rgba(255,26,26,0.25);
      border-radius:6px;
      cursor:pointer;
    }

    .ip:hover{
      color:var(--cyan);
      border-color:var(--cyan);
    }

    .footer{
      margin-top:14px;
      font-size:11px;
      color:#666;
    }
  </style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">
  <img class="icon" src="icon.png" alt="icon" />

  <h1>JazzCraft</h1>
  <p>1.5.2 Survival • Choose your client</p>

  <div class="buttons">
    <a class="btn" href="https://jazzable.github.io/classicclient/">Classic Client</a>
    <a class="btn" href="https://jazzable.github.io/resent/">Resent Client</a>
    <a class="btn discord" href="https://discord.gg/nSrv5eYBHn" target="_blank">Discord</a>
  </div>

  <div class="ip" id="ip" onclick="copyIP()">
    <div style="font-size:11px; color:#777; margin-bottom:4px;">
      Server IP - Click to Copy
    </div>
    wss://join.oriecraft.uk
  </div>

  <div class="footer">
    JazzCraft Launcher v1
  </div>
</div>

<script>
function copyIP(){
  const ip="wss://join.oriecraft.uk";
  navigator.clipboard.writeText(ip);

  const el=document.getElementById("ip");
  el.textContent="COPIED";

  setTimeout(()=>el.textContent=ip,1200);
}

// bg
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const particles=Array.from({length:80},()=>({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*1.5+0.5,
  dx:(Math.random()-0.5)*0.3,
  dy:(Math.random()-0.5)*0.3
}));

function animate(){
  ctx.fillStyle="rgba(0,0,0,0.65)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#ff1a1a";

  particles.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;

    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
