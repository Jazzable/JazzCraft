<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JazzCraft</title>

  <!-- Cyberpunk-style font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      font-family: 'Orbitron', Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 82px;
      margin: 0;
      color: #ff1a1a;
      letter-spacing: 6px;
      text-shadow:
        0 0 4px #ff1a1a,
        0 0 12px #8b0000;
    }

    p {
      margin-top: 10px;
      color: #aaa;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .buttons {
      margin-top: 35px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 14px 32px;
      font-size: 18px;
      color: white;
      text-decoration: none;
      border: 1px solid #ff1a1a;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
      transition: 0.2s ease;
      font-family: 'Orbitron', Arial, sans-serif;
    }

    .btn:hover {
      background: #ff1a1a;
      transform: scale(1.06);
      box-shadow: 0 0 12px #8b0000;
    }

    .server-ip {
      margin-top: 18px;
      font-size: 13px;
      color: #aaa;
      letter-spacing: 1px;
      cursor: pointer;
      padding: 6px 10px;
      border: 1px solid rgba(255, 26, 26, 0.3);
      border-radius: 6px;
      transition: 0.2s ease;
      font-family: 'Orbitron', Arial, sans-serif;
    }

    .server-ip:hover {
      color: #ff1a1a;
      border-color: #ff1a1a;
      box-shadow: 0 0 8px rgba(255, 26, 26, 0.3);
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: #555;
      letter-spacing: 1px;
      font-family: 'Orbitron', Arial, sans-serif;
    }
  </style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">
  <h1>JazzCraft</h1>
  <p>1.5.2 Survival • Choose your client</p>

  <div class="buttons">
    <a class="btn" href="classic.html">Classic Client</a>
    <a class="btn" href="resent.html">Resent Client</a>
  </div>

  <div class="server-ip" id="serverIp" onclick="copyIP()">
    wss://join.oriecraft.uk
  </div>

  <div class="footer">
    v1.0 • Eagler 1.5.2 Launcher
  </div>
</div>

<script>
function copyIP() {
  const ip = "wss://join.oriecraft.uk";
  navigator.clipboard.writeText(ip);

  const el = document.getElementById("serverIp");
  el.textContent = "Copied!";

  setTimeout(() => {
    el.textContent = ip;
  }, 1200);
}

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for (let x = 0; x < columns; x++) drops[x] = 1;

function draw() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#ff1a1a";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters.charAt(Math.floor(Math.random() * letters.length));
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(draw, 33);
</script>

</body>
</html>
